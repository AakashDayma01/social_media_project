name: CI

on:
  push:
    branches:
      - dev

  pull_request:
    branches:
      - dev
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: social_media_db
          POSTGRES_USER: aakash
          POSTGRES_PASSWORD: psql
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aakash -d social_media_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.base
      SECRET_KEY: test-secret-key
      DATABASE_URL: postgresql://aakash:psql@localhost:5432/social_media_db
      STRIPE_SECRET_KEY: ""
      STRIPE_PUBLISHABLE_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django checks
        run: |
          python manage.py check

      - name: Run test cases
        run: |
          pytest

      - name: Build Docker image
        run: |
          docker build -t social-media-project .